    points:["<b>Requirements:</b> get, set and delete with TTL, sub-millisecond latency, scale out by adding nodes.","<b>Partitioning:</b> consistent hashing with virtual nodes, done in a client library or a proxy.","<b>Single node:</b> a hash map plus a doubly linked list gives O(1) LRU eviction.","<b>Replication:</b> optional replicas for hot keys or availability; a cache miss is acceptable, so many caches skip replication.","<b>Hot keys:</b> replicate very popular keys to several nodes or keep a small local cache in each app server.","<b>Deep dives:</b> thundering herd on expiry, consistency with the database (delete on write), and warming a new node."],
    say:"Clients use consistent hashing to pick a node, each node is a hash map with an LRU list, and very hot keys are copied to several nodes.",
    q:"What data structures give O(1) LRU eviction on a single cache node?",
    opts:["A sorted array","A hash map plus a doubly linked list","A binary search tree only","A Bloom filter"], a:1,
    why:"The map finds the entry in O(1); the linked list moves it to the front or drops the oldest in O(1)." },

  { id:"q-mq", kind:"design", group:"Interview questions", title:"Design a distributed message queue", tag:"A conveyor belt that never drops a box",
    eli5:"Picture a long conveyor belt. Senders put numbered boxes on it, and each box stays on the belt for a week. Every reader has a bookmark saying \"I'm at box 57,\" so many readers can read at their own speed, and nobody loses their place.",
    real:"Build a durable, high-throughput log where producers append messages and consumer groups read at their own pace, like Kafka or Pub/Sub.",
    flow:["Producers","Brokers: topic partitions (append-only log)",["Consumer group A","Consumer group B"]],
    points:["<b>Requirements:</b> millions of messages per second, durable, ordered within a partition, replay old messages.","<b>Partitions:</b> each topic splits into partitions, which are append-only files on disk. Ordering holds only within one partition, so pick the partition by key.","<b>Offsets:</b> consumers track their own position, so many groups can read the same data independently.","<b>Replication:</b> each partition has a leader and followers; a write is acknowledged once enough replicas have it.","<b>Delivery:</b> at-least-once by default; exactly-once needs idempotent producers plus transactions.","<b>Deep dives:</b> retention by time or size, consumer rebalancing, back-pressure when consumers fall behind."],
    say:"Messages for the same user go to the same partition by key, so they stay ordered, and each consumer group tracks its own offset so we can replay.",
    q:"How do you keep all events for one user in order?",
    opts:["Use one giant partition for everything","Partition by user ID so that user's events land in the same partition","Sort them on the consumer","Add more brokers"], a:1,
    why:"Order is only guaranteed within a partition, and keying by user sends all of a user's events to one partition." }
];

/* ---------------- storage (optional, per browser) ---------------- */
const LS = "sds-progress-v1", LS_SET = "sds-podcast-settings-v1";
function load(key, fallback) { try { return JSON.parse(localStorage.getItem(key)) ?? fallback; } catch (e) { return fallback; } }
function store(key, val) { try { localStorage.setItem(key, JSON.stringify(val)); } catch (e) {} }
let done = new Set(load(LS, []));
const settings = Object.assign({ rate: 1, autoNext: true, thinkPause: true, vM: "", vL: "" }, load(LS_SET, {}));
const saveSettings = () => store(LS_SET, settings);

const $ = s => document.querySelector(s);
const toc = $("#toc"), page = $("#page");
let mode = "learn";
let currentId = TOPICS[0].id;
const idxOf = id => TOPICS.findIndex(t => t.id === id);
const esc = s => s.replace(/[&<>"]/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;" }[c]));

/* ---------------- table of contents ---------------- */
function renderToc() {
  const groups = [...new Set(TOPICS.map(t => t.group))];
  toc.innerHTML = groups.map(g => `<h3>${g}</h3><div class="group">` +
    TOPICS.filter(t => t.group === g).map(t => {
      const n = idxOf(t.id) + 1;
      const lead = mode === "listen" ? `<span class="epnum">${String(n).padStart(2, "0")}</span>` : `<span class="dot" aria-hidden="true">✓</span>`;
      return `<button data-id="${t.id}" class="${done.has(t.id) ? "done" : ""}" aria-current="${mode !== "quiz" && t.id === currentId}">${lead}${t.title}</button>`;
    }).join("") + `</div>`).join("");
  toc.querySelectorAll("button").forEach(b => b.onclick = () => {
    location.hash = (mode === "listen" ? "listen-" : "") + b.dataset.id;
  });
  $("#bar").style.width = (done.size / TOPICS.length * 100) + "%";
  $("#ptext").textContent = `${done.size} / ${TOPICS.length} understood`;
}

/* ---------------- read view ---------------- */
function flowHTML(flow) {
  return `<div class="flow-box"><div class="flow">` + flow.map((step, i) => {
    const node = Array.isArray(step) ? `<div class="stack">${step.map(s => `<div class="node">${s}</div>`).join("")}</div>`
      : step === "vs" ? `<span class="arrow">vs</span>` : `<div class="node">${step}</div>`;
    const next = flow[i + 1];
    const arrow = i < flow.length - 1 && step !== "vs" && next !== "vs" ? `<span class="arrow" aria-hidden="true">→</span>` : "";
    return node + arrow;
  }).join("") + `</div></div>`;
}

function quizHTML(t, idx) {
  return `<div class="quiz" data-id="${t.id}">
    <p class="q">${idx != null ? (idx + 1) + ". " : ""}${t.q}</p>
    <div class="opts">${t.opts.map((o, i) => `<button class="opt" data-i="${i}">${o}</button>`).join("")}</div>
    <p class="why" hidden></p></div>`;
}

function wireQuiz(root, onAnswer) {
  root.querySelectorAll(".quiz").forEach(qz => {
    const t = TOPICS.find(x => x.id === qz.dataset.id);
    qz.querySelectorAll(".opt").forEach(btn => btn.onclick = () => {
      const pick = +btn.dataset.i;
      qz.querySelectorAll(".opt").forEach((b, i) => { b.disabled = true; if (i === t.a) b.classList.add("right"); });
      if (pick !== t.a) btn.classList.add("wrong");
      const why = qz.querySelector(".why");
      why.innerHTML = (pick === t.a ? "<b>Correct.</b> " : "<b>Not quite.</b> ") + t.why;
      why.hidden = false;
      onAnswer && onAnswer(pick === t.a);
    });
  });
}

function renderTopic() {
  const i = idxOf(currentId), t = TOPICS[i], isDone = done.has(t.id);
  page.innerHTML = `
    <div class="head-row">
      <div><div class="eyebrow">${t.group} · ${i + 1} of ${TOPICS.length}</div>
        <h2>${t.title}</h2><p class="tagline">${t.tag}</p></div>
      <button class="btn" id="listen">▶ Listen to this episode</button>
    </div>
    <div class="story"><span class="lbl">Like you're 5</span><p>${t.eli5}</p></div>
    <div class="section"><span class="lbl">${t.kind === "design" ? "The architecture" : "How it looks"}</span>${flowHTML(t.flow)}</div>
    <div class="section"><span class="lbl">${t.kind === "design" ? "The approach" : "The grown-up version"}</span><p>${t.real}</p></div>
    <div class="two">
      <div class="section"><span class="lbl">${t.kind === "design" ? "The design, step by step" : "What interviewers listen for"}</span><ul>${t.points.map(p => `<li>${p}</li>`).join("")}</ul></div>
      <div class="section"><span class="lbl">Say it like this in the interview</span><p class="say">"${t.say}"</p></div>
    </div>
    <div class="section"><span class="lbl">Check yourself</span>${quizHTML(t)}</div>
    <div class="actions">
      <button class="btn ${isDone ? "got" : "primary"}" id="got">${isDone ? "✓ I understand this" : "Mark as understood"}</button>
      <div class="navbtns">
        <button class="btn" id="prev" ${i === 0 ? "disabled" : ""}>← Previous</button>
        <button class="btn" id="next" ${i === TOPICS.length - 1 ? "disabled" : ""}>Next →</button>
      </div>
    </div>`;
  wireQuiz(page);
  $("#listen").onclick = () => { location.hash = "listen-" + t.id; };
  $("#got").onclick = () => { done.has(t.id) ? done.delete(t.id) : done.add(t.id); store(LS, [...done]); renderTopic(); renderToc(); };
  $("#prev").onclick = () => { location.hash = TOPICS[i - 1].id; };
  $("#next").onclick = () => { location.hash = TOPICS[i + 1].id; };
}

/* ---------------- quiz-all view ---------------- */
function renderQuizAll() {
  let answered = 0, right = 0;
  const order = TOPICS.slice().sort(() => Math.random() - .5);
  page.innerHTML = `
    <div><div class="eyebrow">Mixed review</div><h2>Quiz me on everything</h2>
      <p class="tagline">${TOPICS.length} questions in random order. Missed one? Open its topic on the left and read or listen again.</p></div>
    <div class="score" id="score">0 / ${TOPICS.length} answered</div>
    <div class="qa-list">${order.map((t, i) => quizHTML(t, i)).join("")}</div>
    <div class="actions"><button class="btn primary" id="again">Shuffle and restart</button></div>`;
  wireQuiz(page, ok => {
    answered++; if (ok) right++;
    $("#score").textContent = answered === TOPICS.length
      ? `You got ${right} / ${TOPICS.length}. ${right >= TOPICS.length * 0.9 ? "Interview ready!" : right >= TOPICS.length * 0.65 ? "Close. Review the ones you missed." : "Keep going through the stories, you'll get there."}`
      : `${right} right · ${answered} / ${TOPICS.length} answered`;
  });
  $("#again").onclick = renderQuizAll;
}

/* ---------------- podcast: script ---------------- */
const HOSTS = {
  M: { name: "Maya", role: "the engineer", pitch: 1.05 },
  L: { name: "Leo", role: "prepping for interviews", pitch: 0.9 }
};
const OPEN = ["Okay Maya, explain it like I'm five.", "Pretend I'm five years old. Go.", "Kid version first, please.", "Start me off simple. Really simple."];
const REACT = ["Okay, that actually makes sense. So what's the grown-up version?", "I like that. Now how does it work in a real system?", "Ha, I can picture that. What does it look like at real scale?", "Got it. Now give me the engineer version."];
const ASK = ["And in the interview, what is the interviewer actually listening for?", "What do I need to mention so the interviewer knows I really get it?", "What are the trade-offs I should bring up?"];
const POINT_LEAD = ["First:", "Next:", "Also:", "Another one:", "And:", "Last one:"];
const LETTERS = ["A", "B", "C", "D"];

const plain = s => s.replace(/<[^>]+>/g, "");
function speakable(s) {
  return plain(s)
    .replace(/10⁵/g, "ten to the fifth").replace(/62⁷/g, "62 to the seventh").replace(/≈/g, " about ").replace(/~\s?/g, "about ")
    .replace(/×/g, " times ").replace(/÷/g, " divided by ").replace(/µs/g, " microseconds")
    .replace(/(\d) ?ns\b/g, "$1 nanoseconds").replace(/(\d) ?ms\b/g, "$1 milliseconds")
    .replace(/(\d)\/(\w)/g, "$1 out of $2").replace(/(\d)\s?–\s?(\d)/g, "$1 to $2")
    .replace(/→/g, " then ").replace(/[–—·⇄]/g, ", ").replace(/_/g, " ").replace(/\bQPS\b/g, "queries per second")
    .replace(/\s+/g, " ").trim();
}

function buildScript(i) {
  const t = TOPICS[i], next = TOPICS[i + 1], L = [];
  const say = (who, text) => L.push({ who, text });
  if (i === 0) {
    say("L", "Welcome to System Design Storybook. I'm Leo, and I'm getting ready for a big tech interview.");
    say("M", "And I'm Maya. I've sat on the other side of the table a lot, so I'll explain every idea like you're five, then give you the real version.");
  } else {
    say("L", `Welcome back to System Design Storybook, episode ${i + 1}. I'm Leo.`);
  }
  const design = t.kind === "design";
  say("M", `${i === 0 ? "" : "And I'm Maya. "}${design ? `Today is a full interview question. The interviewer says: ${t.title}. ${t.tag}.` : `Today's topic is ${t.title}. ${t.tag}.`}`);
  say("L", design ? "That sounds big. Before any boxes and arrows, explain the idea like I'm five." : OPEN[i % OPEN.length]);
  say("M", t.eli5);
  say("L", design ? "Okay, so what is the system really doing?" : REACT[i % REACT.length]);
  say("M", t.real);
  say("L", design ? "Walk me through it the way I should do it in the interview, step by step." : ASK[i % ASK.length]);
  t.points.forEach((p, k) => say("M", design
    ? `${k === t.points.length - 1 ? "And finally" : "Step " + (k + 1)}. ${plain(p)}`
    : (k === t.points.length - 1 && k > 0 ? "Last one: " : POINT_LEAD[k] + " ") + plain(p)));
  say("L", "Give me a line I can actually say out loud in the room.");
  say("M", `Try this: ${t.say}`);
  say("L", "Okay. Quiz me.");
  say("M", `Here's the question. ${t.q} ` + t.opts.map((o, k) => `${k === t.opts.length - 1 ? "or " : ""}${LETTERS[k]}: ${o}`).join(". ") + ".");
  L.push({ pause: 5000, text: "Thinking time. Pick your answer." });
  say("M", `The answer is ${LETTERS[t.a]}: ${t.opts[t.a]}. ${t.why}`);
  say("L", next ? `Got it. Next episode, we tackle ${next.title}.` : "That's the whole series. Go back to any episode you want to hear again, and good luck in the interview.");
  say("M", next ? "See you there." : "You've got this.");
  return L;
}

/* ---------------- podcast: speech engine ---------------- */
const TTS = "speechSynthesis" in window && "SpeechSynthesisUtterance" in window;
const P = { ep: -1, lines: [], li: 0, playing: false, gen: 0 };
let voices = [];

function pickDefault(preferred, avoid) {
  const tryRe = re => voices.find(v => re.test(v.name) && v.voiceURI !== avoid);
  return tryRe(preferred) || voices.find(v => v.voiceURI !== avoid && v.localService) || voices.find(v => v.voiceURI !== avoid) || voices[0];
}
function loadVoices() {
  if (!TTS) return;
  const all = speechSynthesis.getVoices();
  voices = all.filter(v => /^en/i.test(v.lang));
  if (!voices.length) voices = all;
  if (!voices.length) return;
  if (!voices.some(v => v.voiceURI === settings.vM)) settings.vM = (pickDefault(/female|samantha|zira|aria|jenny|libby|sonia|karen|google us english/i) || {}).voiceURI || "";
  if (!voices.some(v => v.voiceURI === settings.vL)) settings.vL = (pickDefault(/\bmale|david|guy|daniel|ryan|george|alex|google uk english male/i, settings.vM) || {}).voiceURI || "";
  fillVoiceSelects();
}
function voiceFor(who) { return voices.find(v => v.voiceURI === (who === "M" ? settings.vM : settings.vL)); }
function chunks(text) { const s = speakable(text); return s.match(/[^.!?]+[.!?]+["')]*\s*|[^.!?]+$/g) || [s]; }

function loadEpisode(i) {
  if (P.ep === i) return;
  stopSpeech();
  P.ep = i; P.lines = buildScript(i); P.li = 0;
}
function stopSpeech() { P.gen++; P.playing = false; if (TTS) speechSynthesis.cancel(); }
function playFrom(li) {
  if (!TTS) return;
  stopSpeech();
  P.li = li; P.playing = true;
  const g = P.gen;
  updatePlayer();
  setTimeout(() => runLine(g), 80); // small gap: some browsers drop speech queued right after cancel()
}
function pause() { stopSpeech(); updatePlayer(); }

function runLine(g) {
  if (g !== P.gen) return;
  if (P.li >= P.lines.length) { P.playing = false; P.li = P.lines.length; updatePlayer(); episodeEnded(); return; }
  updatePlayer();
  const line = P.lines[P.li];
  if (line.pause != null) {
    if (!settings.thinkPause) { P.li++; return runLine(g); }
    setTimeout(() => { if (g !== P.gen) return; P.li++; runLine(g); }, line.pause);
    return;
  }
  const parts = chunks(line.text); let k = 0;
  const host = HOSTS[line.who], v = voiceFor(line.who);
  const sameVoice = settings.vM === settings.vL;
  const sayNext = () => {
    if (g !== P.gen) return;
    if (k >= parts.length) { P.li++; setTimeout(() => runLine(g), 280); return; }
    const u = new SpeechSynthesisUtterance(parts[k++]);
    if (v) { u.voice = v; u.lang = v.lang; }
    u.rate = settings.rate;
    u.pitch = sameVoice ? (line.who === "M" ? 1.2 : 0.8) : host.pitch;
    u.onend = sayNext;
    u.onerror = e => { if (e.error === "interrupted" || e.error === "canceled") return; sayNext(); };
    speechSynthesis.speak(u);
  };
  sayNext();
}

function episodeEnded() {
  const t = TOPICS[P.ep];
  if (settings.autoNext && P.ep < TOPICS.length - 1 && mode === "listen") {
    location.hash = "listen-" + TOPICS[P.ep + 1].id;
    loadEpisode(P.ep + 1);
    renderListen(); playFrom(0);
  }
}

/* ---------------- podcast: view ---------------- */
const ICON = {
  play: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4.5v15l13-7.5z"/></svg>',
  pause: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 4h4v16H6zM14 4h4v16h-4z"/></svg>',
  prev: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 5h2v14H6zM20 5v14L9 12z"/></svg>',
  next: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M16 5h2v14h-2zM4 5v14l11-7z"/></svg>',
  back: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M11 6v12L3 12zM21 6v12l-8-6z"/></svg>',
  fwd: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M13 6v12l8-6zM3 6v12l8-6z"/></svg>'
};
const wordsIn = lines => lines.reduce((n, l) => n + (l.pause ? 0 : l.text.split(/\s+/).length), 0);
const fmtMin = words => { const m = words / (160 * settings.rate); return m < 1 ? "under 1 min" : `${Math.round(m)} min`; };

function fillVoiceSelects() {
  ["M", "L"].forEach(w => {
    const sel = document.getElementById("voice-" + w);
    if (!sel) return;
    sel.innerHTML = voices.map(v => `<option value="${esc(v.voiceURI)}">${esc(v.name)} (${esc(v.lang)})</option>`).join("");
    sel.value = w === "M" ? settings.vM : settings.vL;
  });
}

function renderListen() {
  const i = idxOf(currentId), t = TOPICS[i];
  loadEpisode(i);
  const total = wordsIn(P.lines);
  page.innerHTML = `
    <div class="deck">
      <div><div class="eyebrow">Episode ${String(i + 1).padStart(2, "0")} of ${TOPICS.length} · ${t.group}</div>
        <h2>${t.title}</h2><p class="tagline">${t.tag} · about ${fmtMin(total)}</p></div>
      <div class="hosts">
        <span class="host" id="host-M"><span class="avatar av-M">M</span><span><b>Maya</b> · ${HOSTS.M.role}</span></span>
        <span class="host" id="host-L"><span class="avatar av-L">L</span><span><b>Leo</b> · ${HOSTS.L.role}</span></span>
      </div>
      ${TTS ? "" : `<div class="notice">This browser can't read text aloud. Open the page in a recent Chrome, Edge, Safari or Firefox to use the podcast. You can still read the transcript below.</div>`}
      <div class="controls">
        <button class="ctrl" id="p-prev" aria-label="Previous episode" ${i === 0 ? "disabled" : ""}>${ICON.prev}</button>
        <button class="ctrl" id="p-back" aria-label="Back one line">${ICON.back}</button>
        <button class="ctrl play" id="p-play" aria-label="Play" ${TTS ? "" : "disabled"}>${ICON.play}</button>
        <button class="ctrl" id="p-fwd" aria-label="Forward one line">${ICON.fwd}</button>
        <button class="ctrl" id="p-next" aria-label="Next episode" ${i === TOPICS.length - 1 ? "disabled" : ""}>${ICON.next}</button>
        <div class="meter"><div class="track"><i id="p-track"></i></div>
          <div class="meta"><span id="p-pos">Line 0 / ${P.lines.length}</span><span id="p-left"></span></div></div>
      </div>
      <div class="settings">
        <label>Speed <select id="p-rate">${[0.8, 0.9, 1, 1.1, 1.25, 1.5, 1.75].map(r => `<option value="${r}" ${r == settings.rate ? "selected" : ""}>${r}×</option>`).join("")}</select></label>
        <label>Maya's voice <select id="voice-M"></select></label>
        <label>Leo's voice <select id="voice-L"></select></label>
        <label><input type="checkbox" id="p-auto" ${settings.autoNext ? "checked" : ""}> Play next episode automatically</label>
        <label><input type="checkbox" id="p-think" ${settings.thinkPause ? "checked" : ""}> Pause 5 seconds before quiz answers</label>
      </div>
    </div>
    <div class="section">
      <span class="lbl">Transcript · tap any line to play from there</span>
      <div class="transcript" id="transcript">${P.lines.map((l, k) => l.pause != null
        ? `<button class="tline pause" data-k="${k}"><span class="who"></span><span>${l.text}</span></button>`
        : `<button class="tline" data-k="${k}"><span class="who ${l.who}">${HOSTS[l.who].name}</span><span>${esc(plain(l.text))}</span></button>`).join("")}</div>
    </div>
    <div class="actions">
      <button class="btn ${done.has(t.id) ? "got" : "primary"}" id="got">${done.has(t.id) ? "✓ I understand this" : "Mark as understood"}</button>
      <button class="btn" id="read">Read this topic instead</button>
    </div>`;

  fillVoiceSelects();
  $("#p-play").onclick = () => P.playing ? pause() : playFrom(P.li >= P.lines.length ? 0 : P.li);
  $("#p-back").onclick = () => { const to = Math.max(0, P.li - 1); P.playing ? playFrom(to) : (P.li = to, updatePlayer()); };
  $("#p-fwd").onclick = () => { const to = Math.min(P.lines.length - 1, P.li + 1); P.playing ? playFrom(to) : (P.li = to, updatePlayer()); };
  $("#p-prev").onclick = () => { if (i > 0) { const was = P.playing; location.hash = "listen-" + TOPICS[i - 1].id; if (was) setTimeout(() => playFrom(0), 0); } };
  $("#p-next").onclick = () => { if (i < TOPICS.length - 1) { const was = P.playing; location.hash = "listen-" + TOPICS[i + 1].id; if (was) setTimeout(() => playFrom(0), 0); } };
  $("#p-rate").onchange = e => { settings.rate = +e.target.value; saveSettings(); if (P.playing) playFrom(P.li); };
  $("#voice-M").onchange = e => { settings.vM = e.target.value; saveSettings(); if (P.playing) playFrom(P.li); };
  $("#voice-L").onchange = e => { settings.vL = e.target.value; saveSettings(); if (P.playing) playFrom(P.li); };
  $("#p-auto").onchange = e => { settings.autoNext = e.target.checked; saveSettings(); };
  $("#p-think").onchange = e => { settings.thinkPause = e.target.checked; saveSettings(); };
  $("#transcript").querySelectorAll(".tline").forEach(b => b.onclick = () => playFrom(+b.dataset.k));
  $("#got").onclick = () => { done.has(t.id) ? done.delete(t.id) : done.add(t.id); store(LS, [...done]); renderListen(); renderToc(); };
  $("#read").onclick = () => { location.hash = t.id; };
  updatePlayer();
}

let lastScrolled = -1;
function updatePlayer() {
  const play = $("#p-play");
  if (!play) return;
  play.innerHTML = P.playing ? ICON.pause : ICON.play;
  play.setAttribute("aria-label", P.playing ? "Pause" : "Play");
  const n = P.lines.length, cur = Math.min(P.li, n);
  $("#p-track").style.width = (cur / n * 100) + "%";
  $("#p-pos").textContent = cur >= n ? "Episode finished" : `Line ${cur + 1} / ${n}`;
  $("#p-left").textContent = cur >= n ? "" : `${fmtMin(wordsIn(P.lines.slice(cur)))} left`;
  const line = P.lines[cur];
  ["M", "L"].forEach(w => $("#host-" + w).classList.toggle("talking", P.playing && line && line.who === w));
  document.querySelectorAll("#transcript .tline").forEach((el, k) => {
    el.classList.toggle("now", k === cur && cur < n);
    el.classList.toggle("past", k < cur);
  });
  if (P.playing && cur !== lastScrolled) {
    lastScrolled = cur;
    const el = document.querySelector(`#transcript .tline[data-k="${cur}"]`);
    if (el) el.scrollIntoView({ block: "nearest", behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth" });
  }
}

/* ---------------- routing ---------------- */
function setMode(m) {
  if (m !== "listen" && P.playing) pause();
  mode = m;
  $("#tab-learn").setAttribute("aria-pressed", m === "learn");
  $("#tab-listen").setAttribute("aria-pressed", m === "listen");
  $("#tab-quiz").setAttribute("aria-pressed", m === "quiz");
  if (m === "learn") renderTopic(); else if (m === "listen") renderListen(); else renderQuizAll();
  renderToc();
}
function route() {
  const h = decodeURIComponent(location.hash.slice(1));
  if (h === "quiz") return setMode("quiz");
  const listen = h.startsWith("listen");
  const id = listen ? h.replace(/^listen-?/, "") : h;
  if (idxOf(id) >= 0) currentId = id;
  setMode(listen ? "listen" : "learn");
  if (h && window.innerWidth <= 820) page.scrollIntoView({ block: "start" });
}

$("#tab-learn").onclick = () => { location.hash = currentId; };
$("#tab-listen").onclick = () => { location.hash = "listen-" + currentId; };
$("#tab-quiz").onclick = () => { location.hash = "quiz"; };
window.addEventListener("hashchange", route);
document.addEventListener("keydown", e => {
  if (mode !== "listen" || e.code !== "Space" || /^(BUTTON|SELECT|INPUT|TEXTAREA)$/.test(e.target.tagName)) return;
  e.preventDefault(); $("#p-play").click();
});
window.addEventListener("pagehide", () => { if (TTS) speechSynthesis.cancel(); });
if (TTS) { loadVoices(); speechSynthesis.onvoiceschanged = loadVoices; }
route();
</script>
